[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dl-cardiac-segmentation-research"
version = "0.2.0"
description = "Framework em PyTorch e nnU-Net v2 para segmentação cardíaca e de fibrose em LGE-CMR (UFJF)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Robert Gonçalves Vieira de Souza" }
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "nibabel>=5.1",
  "SimpleITK>=2.3",
  "pydicom>=2.4",
  "scikit-image>=0.22",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "kaggle>=1.6",
  "six>=1.16",
]

[project.optional-dependencies]
train = [
  "torch>=2.1",
  "nnunetv2>=2.4",
  "medpy>=0.5",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
